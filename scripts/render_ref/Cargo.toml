[package]
name = "soorat-render-ref"
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
license = "GPL-3.0-only"
publish = false
description = "Class-G render-reference corpus: fixed scenes rendered offscreen by the frozen Rust soorat 1.2.0 oracle (rust-old/) (docs/development/soorat-port-plan.md §4 step 6)"

# The oracle by path, never edited. Cargo.lock is seeded from soorat 1.2.0's own
# lock, so every shared dependency is the oracle's exact version; build with
# `cargo build --release --locked`.
[[bin]]
name = "render_ref"
path = "src/main.rs"

[dependencies]
soorat = { path = "../../rust-old", features = ["optics", "fluids", "acoustics", "em", "thermo"] }
# The science crates, for the synthetic renderer inputs (same versions and
# features as the oracle enables).
goonj = { version = "=1.4.3", features = ["soorat-compat"] }
ushma = { version = "=1.4.0", features = ["soorat-compat"] }
bijli = { version = "=1.2.0", features = ["soorat-compat"] }
pravash = { version = "=1.3.0", features = ["sph", "shallow"] }
wgpu = "=29.0.4"
pollster = "=1.0.1"
bytemuck = "=1.25.2"
image = { version = "=0.25.10", default-features = false, features = ["png"] }
serde = { version = "=1.0.229", features = ["derive"] }
# float_roundtrip: correctly rounded number parsing, so the exact decimals in
# scenes.json come back bit for bit.
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
# Not in the oracle's tree: the manifest's content hashes.
sha2 = "=0.10.9"

[profile.release]
overflow-checks = true
