[package]
name = "soorat-probes"
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
license = "GPL-3.0-only"
publish = false
description = "M0 step 1 probes on the frozen Rust soorat 1.2.0 oracle (docs/development/soorat-port-plan.md §4)"

# The oracle by path, never edited. Cargo.lock is seeded from soorat 1.2.0's own
# lock, so every shared dependency is the oracle's exact version.
[dependencies]
soorat = { path = "../../..", features = ["oracle"] }
# The oracle's image version and codecs, for the decoder probe (P10).
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "bmp"] }
# WGSL layouts for the layout probe (P1): naga, the version soorat 1.2.0 validates its shaders with.
naga = { version = "29", features = ["wgsl-in"] }

[profile.release]
overflow-checks = true
