name: CI

# The Cyrius port (docs/development/soorat-port-plan.md, ADR 0003). No Rust is built or run here: rust-old/ is the
# frozen 1.2.0 source, read as the functionality reference only, and the tests' oracle is correctness, not Rust.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:   # reusable: release.yml gates on this CI workflow

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cyrius:
    name: Cyrius — build, test, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4 (pinned — the release-integrity hardening item)

      - name: Install Cyrius toolchain
        # The cyrius.cyml [package].cyrius pin is the single source of truth for the toolchain version.
        run: |
          set -e
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies (every feature: the repository tests them all)
        # The optional features' tests (tests/color_optics.tcyr, tests/parity_features.tcyr) include prakash and
        # impetus, optional dependencies, so the default resolve would leave them uncompilable (ranga's CI does the same).
        run: cyrius deps --locked --features optics,physics-debug,acoustics,thermo,fluids

      - name: Build
        run: cyrius build

      - name: Test (includes tests/parity.tcyr, the golden-corpus replay)
        run: cyrius test

      # The f32 and f64 type diagnostics appear only under --bounds; the gate is zero warnings (CLAUDE.md).
      - name: Test (bounds-checked)
        run: cyrius test --bounds

      - name: Bundles current (dist/soorat.cyr from [lib], and each [lib.<feature>] profile's)
        run: cyrius distlib --check

      - name: Golden corpus re-derivation (no Rust needed)
        run: python3 -I -B scripts/oracle/validate.py .

      - name: Generated layouts current (src/layout.cyr, tests/layout_probe.cyr, against tests/golden/layout.tsv)
        run: python3 -I -B scripts/oracle/gen_layout.py . --check

      - name: Generated tables current (src/tables_data.cyr, from tests/golden/tables.tsv)
        run: python3 -I -B scripts/oracle/gen_tables.py . --check

      - name: Audit (fmt, lint, docs, tests, bench)
        # Run directly, not through a pipe, so the job sees audit's own exit status.
        run: cyrius audit

  port-tooling:
    name: Port tooling — surface, tests, benches, upstream ledger, doc examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # Milestone "done" comes from the plan's §14 Tracking table (a ✅ in the Status cell).
      - run: python3 -I -B scripts/surface_parity.py . --check
      - run: python3 -I -B scripts/rust_test_ledger.py . --check
      - run: python3 -I -B scripts/bench_record.py . --check
      - run: python3 -I -B scripts/upstream_ledger.py . --check   # sibling repos aren't checked out on CI: filed paths report "unverified"
      # Needs no toolchain while there are no ```cyrius examples; once there are, move it into the `cyrius`
      # job after Build, preceded by `cyrius distlib`.
      - run: python3 -I -B scripts/doc_examples.py . --check
      - run: python3 -I -B scripts/vendor_crmath.py . --check   # ../kimiya isn't checked out on CI: reports "unverified"
