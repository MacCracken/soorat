name: CI

# During the Cyrius port (docs/development/soorat-port-plan.md) this workflow checks both trees:
# - the Cyrius port at the repository root (`cyrius` job);
# - the frozen Rust 1.2.0 oracle in rust-old/ (the `oracle-*` jobs), which stays green until 2.0.0
#   removes it. rust-old/ is never edited; these jobs only prove it still builds and passes.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:   # reusable: release.yml gates on this CI workflow

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  cyrius:
    name: Cyrius — build, test, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4 (pinned — the release-integrity hardening item)

      - name: Install Cyrius toolchain
        # The cyrius.cyml [package].cyrius pin is the single source of truth for the toolchain version.
        run: |
          set -e
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        run: cyrius deps --locked

      - name: Build
        run: cyrius build

      - name: Test (includes tests/parity.tcyr, the golden-corpus replay)
        run: cyrius test

      # The f32 and f64 type diagnostics appear only under --bounds; the gate is zero warnings (CLAUDE.md).
      - name: Test (bounds-checked)
        run: cyrius test --bounds

      - name: Bundle current (dist/soorat.cyr is what distlib writes from [lib])
        run: cyrius distlib --check

      - name: Golden corpus re-derivation (no Rust needed)
        run: python3 -I -B scripts/oracle/validate.py .

      - name: Generated layouts current (src/layout.cyr, tests/layout_probe.cyr, against tests/golden/layout.tsv)
        run: python3 -I -B scripts/oracle/gen_layout.py . --check

      - name: Audit (fmt, lint, docs, tests, bench)
        # Run directly, not through a pipe, so the job sees audit's own exit status.
        run: cyrius audit

  port-tooling:
    name: Port tooling — surface, tests, benches, upstream ledger, doc examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # Milestone "done" comes from the plan's §14 Tracking table (a ✅ in the Status cell).
      - run: python3 -I -B scripts/surface_parity.py . --check
      - run: python3 -I -B scripts/rust_test_ledger.py . --check
      - run: python3 -I -B scripts/bench_record.py . --check
      - run: python3 -I -B scripts/upstream_ledger.py . --check   # sibling repos aren't checked out on CI: filed paths report "unverified"
      # Needs no toolchain while there are no ```cyrius examples; once there are, move it into the `cyrius`
      # job after Build, preceded by `cyrius distlib`.
      - run: python3 -I -B scripts/doc_examples.py . --check

  oracle-check:
    name: Oracle (Rust 1.2.0) — check & lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust-old
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-old
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-features --all-targets -- -D warnings
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo check

  oracle-security:
    name: Oracle — security audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust-old
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit
      - run: cargo audit

  oracle-deny:
    name: Oracle — supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: rust-old/Cargo.toml

  oracle-test:
    name: Oracle — test (${{ matrix.os }})
    needs: [oracle-check]
    strategy:
      fail-fast: false
      matrix:
        include:
          # `drm` (agnosys) is Linux-only, so macOS tests the `full` set.
          - os: ubuntu-latest
            features: --all-features
          - os: macos-latest
            features: --features full
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust-old
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-old
      # GPU smoke tests (tests/gpu_smoke.rs) skip when the runner has no adapter;
      # tests/shaders.rs validates every WGSL file without a GPU.
      - run: cargo test
      - run: cargo test ${{ matrix.features }}
      - run: cargo test --doc

  oracle-msrv:
    name: Oracle — MSRV (1.100)
    runs-on: ubuntu-latest
    needs: [oracle-check]
    env:
      MSRV: "1.100"
    defaults:
      run:
        working-directory: rust-old
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.MSRV }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-old
      # rust-old/rust-toolchain.toml pins `stable`; `+toolchain` overrides the file.
      - run: cargo +${{ env.MSRV }} check --all-features
      - run: cargo +${{ env.MSRV }} test --all-features

  oracle-doc:
    name: Oracle — documentation
    runs-on: ubuntu-latest
    needs: [oracle-check]
    defaults:
      run:
        working-directory: rust-old
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-old
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --all-features
