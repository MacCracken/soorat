[graph]
# Check every optional integration (screenshot/reqwest, drm/agnosys git, ...),
# not just the default feature set.
all-features = true

[advisories]
ignore = [
    # ttf-parser is unmaintained (no known vulnerability). Pulled only via
    # winit 0.30 → sctk-adwaita → ab_glyph (Wayland client-side decorations).
    # winit 0.30.13 is the latest stable; revisit when winit moves off ab_glyph.
    "RUSTSEC-2026-0192",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "GPL-3.0-only",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# agnosys (drm feature) — pinned to the last Rust tag. The GitHub repo has since
# been renamed to agnodrm (no longer Rust); GitHub redirects the old URL.
allow-git = ["https://github.com/MacCracken/agnosys"]
